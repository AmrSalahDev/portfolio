<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amr Salah | Flutter Developer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Lottie Player Web Component -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/services.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/portfolio.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
    <!-- Header Section -->
    <div id="header-placeholder"></div>

    <!-- Hero Section -->
    <div id="hero-placeholder"></div>

    <!-- Services Section -->
    <div id="services-placeholder"></div>

    <!-- About Section -->
    <div id="about-placeholder"></div>

    <!-- Portfolio Section -->
    <div id="portfolio-placeholder"></div>

    <!-- Contact Section -->
    <div id="contact-placeholder"></div>

    <!-- Footer Section -->
    <div id="footer-placeholder"></div>

    <script src="js/script.js"></script>
    
    <!-- Load Sections -->
    <script>
        // Function to load HTML sections
        function loadSection(sectionId, filePath) {
            fetch(filePath)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(sectionId).innerHTML = data;
                })
                .catch(error => console.error('Error loading section:', error));
        }

        // Load all sections
        document.addEventListener('DOMContentLoaded', function() {
            loadSection('header-placeholder', 'sections/header.html');
            loadSection('hero-placeholder', 'sections/hero.html');
            loadSection('services-placeholder', 'sections/services.html');
            loadSection('about-placeholder', 'sections/about.html');
            loadSection('portfolio-placeholder', 'sections/portfolio.html');
            loadSection('contact-placeholder', 'sections/contact.html');
            loadSection('footer-placeholder', 'sections/footer.html');
        });
    </script>
</body>
</html>
